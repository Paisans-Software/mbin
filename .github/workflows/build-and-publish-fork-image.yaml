name: Build and publish fork Docker image

# Fork-only workflow. Upstream publishes ghcr.io/mbinorg/mbin from action.yaml,
# which this fork cannot push to. This builds the same docker/Dockerfile and
# publishes it under the fork's own namespace instead.
#
# Branch pushes build the image. Release tags do not rebuild: they retag the
# digest the branch push already produced, so the release tag and :latest are
# provably the same bits.
on:
  push:
    branches:
      - main
      - develop
    tags:
      - 'v*\+paisans'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: startsWith(github.ref, 'refs/heads/')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v6

      - name: Login to ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Docker meta data
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=sha,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./docker/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  retag:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      packages: write

    steps:
      - name: Login to ghcr
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Docker tags cannot contain '+', so the SemVer build metadata separator
      # becomes '-': v1.11.0+paisans is published as 1.11.0-paisans.
      - name: Retag the image the branch build already produced
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # A registry path must be lowercase and github.repository keeps the
          # owner's case (Paisans-Software). metadata-action lowercases for the
          # build job; this step has to do it itself.
          IMAGE="${IMAGE,,}"
          version="${TAG_NAME#v}"
          version="${version//+/-}"
          source="${IMAGE}:sha-${GITHUB_SHA::7}"

          if ! docker buildx imagetools inspect "$source" >/dev/null 2>&1; then
            echo "::error::No image found at ${source}. Push the branch and let its"
            echo "::error::build finish before pushing the release tag."
            exit 1
          fi

          docker buildx imagetools create -t "${IMAGE}:${version}" "$source"
          docker buildx imagetools inspect "${IMAGE}:${version}"

  # A merge to main that changes mbin_version is a release. The version file is
  # the single source of truth, so the tag cannot disagree with what the running
  # app reports. Tags pushed with GITHUB_TOKEN do not trigger workflows, so this
  # job retags the image itself rather than relying on the retag job above.
  release:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      pull-requests: write
      issues: write

    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Work out whether this is a new version
        id: version
        run: |
          set -euo pipefail
          version=$(sed -nE "s/^[[:space:]]*mbin_version:[[:space:]]*'([^']+)'.*/\1/p" \
            config/services.yaml | head -1)

          if [ -z "$version" ]; then
            echo "::error::Could not read mbin_version from config/services.yaml"
            exit 1
          fi

          tag="v${version}"
          if git rev-parse -q --verify "refs/tags/${tag}" >/dev/null; then
            echo "Tag ${tag} already exists, nothing to release."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

          # Without this, the notes generator falls back to the newest tag it can
          # find, which is one of the 39 upstream release tags this fork carries,
          # and the notes then cover every upstream change too.
          previous=$(git tag --list '*+paisans' --sort=-creatordate | head -1)

          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "docker_tag=${version//+/-}" >> "$GITHUB_OUTPUT"
          echo "previous=${previous}" >> "$GITHUB_OUTPUT"

      - name: Create and push the release tag
        if: steps.version.outputs.release == 'true'
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"

      # Release pull requests carry no change of their own. The notes generator
      # filters by label and by nothing else, so they are labelled here, before
      # the notes are generated below, and dropped by .github/release.yml.
      #
      # Two of them per release: the "Release X" pull request into develop, and
      # the "Release X to main" pull request that this run is the merge of.
      - name: Label the release pull requests
        if: steps.version.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh label create release --repo "$REPO" --force \
            --color ededed \
            --description 'Release plumbing; excluded from generated release notes'
          {
            gh api "repos/${REPO}/commits/${GITHUB_SHA}/pulls" \
              --jq '.[] | select(.merged_at != null) | .number'
            gh pr list --repo "$REPO" --state merged --limit 20 \
              --json number,headRefName \
              --jq '.[] | select(.headRefName | startswith("release-")) | .number'
          } | sort -u | while read -r pr; do
            gh pr edit "$pr" --repo "$REPO" --add-label release
          done

      - name: Publish the GitHub release
        if: steps.version.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ steps.version.outputs.tag }}
          PREVIOUS: ${{ steps.version.outputs.previous }}
        run: |
          set -euo pipefail

          # The operator-facing notes are written by hand in the release PR. The
          # list of what changed is generated from the commit range, so work
          # merged into develop cannot go unmentioned if the PR body forgets it.
          body=$(gh api "repos/${REPO}/commits/${GITHUB_SHA}/pulls" \
            --jq 'first(.[] | select(.merged_at != null) | .body // "") // ""')

          if [ -z "$body" ]; then
            body="No operator notes were provided in the release pull request."
          fi

          gh api "repos/${REPO}/releases" \
            -f "tag_name=${TAG}" \
            -f "name=${TAG}" \
            -f "body=${body}" \
            -F generate_release_notes=true \
            ${PREVIOUS:+-f "previous_tag_name=${PREVIOUS}"} \
            --jq '.html_url'

      - name: Login to ghcr
        if: steps.version.outputs.release == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag the image that the build job already published
        if: steps.version.outputs.release == 'true'
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          DOCKER_TAG: ${{ steps.version.outputs.docker_tag }}
        run: |
          set -euo pipefail
          # Lowercase for the same reason as the retag job above.
          IMAGE="${IMAGE,,}"
          source="${IMAGE}:sha-${GITHUB_SHA::7}"
          docker buildx imagetools create -t "${IMAGE}:${DOCKER_TAG}" "$source"
          docker buildx imagetools inspect "${IMAGE}:${DOCKER_TAG}"
